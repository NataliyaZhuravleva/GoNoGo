[project]
name = "gonogo"
version = "0.1.0"
description = "PNW Mountaineering Conditions Board"
authors = [
    {name = "Nataliya Zhuravleva"},
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "google-adk[gcp]>=2.0.0,<3.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gonogo"]

[tool.pytest.ini_options]
pythonpath = ["."]
